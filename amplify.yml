version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        - node --version
        - npm install -g pnpm@12.4.2
        - pnpm --version
        - pnpm install --frozen-lockfile

    build:
      commands:
        - pnpm run build

  artifacts:
    baseDirectory: out
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*